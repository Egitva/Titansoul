<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deck Builder</title>
  <link rel="stylesheet" href="css/style_deck.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span>TITANSOUL <span class="text-yellow">Card Game</span></span>
            </div>
            <div class="nav-links">
                <a href="index.html">База карт</a>
                <a href="deck.html" class="active">Создать колоду</a>
                <a href="playtest.html">Playtest</a>
            </div>
        </div>
    </nav>
<div class="container">
  <!-- Левая панель - все карты -->
  <div class="sidebar">
    <h2>Все карты</h2>
<input type="text" id="search-input" placeholder="Поиск по имени..." onkeyup="searchCards()">
  
  <select id="filter-type" onchange="searchCards()">
    <option value="">Все типы</option>
    <option value="Тенто">Тенто</option>
    <option value="Лидер">Лидер</option>
    <option value="ALT">ALT</option>
    <option value="Overlay">Overlay</option>
    <option value="Dark">Dark</option>
    <option value="Проклятие">Проклятие</option>
    <option value="Фея">Фея</option>
    <option value="Растение">Растение</option>
    <option value="Чародей">Чародей</option>
    <option value="Маг">Маг</option>
    <option value="Демон">Демон</option>
    <option value="Дух">Дух</option>
    <option value="Ангел">Ангел</option>
    <option value="Бастион">Бастион</option>
  </select>


  <select id="filter-color" onchange="searchCards()">
    <option value="">Все цвета</option>
    <option value="R">R (Красный)</option>
    <option value="W">W (Белый)</option>
    <option value="Y">Y (Жёлтый)</option>
    <option value="B">B (Синий)</option>
    <option value="G">G (Зелёный)</option>
    <option value="D">D (Черный)</option>
  </select>


  <button onclick="clearFilters()">Сбросить</button>
  <div id="all-cards" class="card-grid"></div>
  </div>


  <!-- Основная область - деки -->
  <div class="main">
    <div class="deck-area">


      <!-- Main Deck -->
      <div class="deck">
        <h2>Main Deck <span id="main-count" class="count">(0/100)</span></h2>
        <div id="main-deck" class="card-grid"></div>
        <button class="btn" onclick="clearDeck('main')">Очистить Main</button>
      </div>


      <!-- Extra Deck -->
      <div class="deck">
        <h2>Extra Deck <span id="extra-count" class="count">(0/100)</span></h2>
        <div id="extra-deck" class="card-grid"></div>
        <button class="btn" onclick="clearDeck('extra')">Очистить Extra</button>
      </div>


      <!-- Leader Zone -->
      <div class="deck">
        <h2>Лидерская зона <span id="leader-count" class="count">(0/2)</span></h2>
        <div id="leader-deck" class="card-grid"></div>
        <button class="btn" onclick="clearDeck('leader')">Очистить Лидеров</button>
      </div>
    </div>


    <div style="margin-top: 20px;">
      <button class="btn" onclick="exportDeck()">Экспорт колоды (JSON)</button>
      <button class="btn" onclick="importDeck()">Импорт колоды</button>
      <button class="btn" onclick="saveDeckToLocal()">Сохранить колоду для теста</button>
      <button class="btn" onclick="exportProxyPDF()" style="background:#4ade80; color:black;">Экспорт PDF (Прокси)</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">
    </div>
  </div>
</div>
<script src="js/deck.js"></script>
</body>
</html>
